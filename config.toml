# cc-proxy v0.2.0 model configuration
# 生产配置

[models]
default = "glm-5.3-flash"

[models.mapping]
# L1: Opus → glm-5.3（2026-08-21 分层：方案设计层）
"claude-opus-4-7" = "glm-5.3"
"claude-opus-4-6" = "glm-5.3"
"claude-opus-4-5" = "glm-5.3"
"claude-opus-4" = "glm-5.3"
# L2: Sonnet → glm-5.3-flash（2026-08-28 替换：AA 57 vs 50，成本更低）
# 覆盖所有 sonnet 变体：版本号系列 + 带日期后缀的全名
"claude-sonnet-5"   = "glm-5.3-flash"
"claude-sonnet-4-7" = "glm-5.3-flash"
"claude-sonnet-4-6" = "glm-5.3-flash"
"claude-sonnet-4-5" = "glm-5.3-flash"
"claude-sonnet-4-1" = "glm-5.3-flash"
"claude-sonnet-4-0" = "glm-5.3-flash"
"claude-sonnet-4"   = "glm-5.3-flash"
"claude-sonnet-3-7" = "glm-5.3-flash"
"claude-3-7-sonnet" = "glm-5.3-flash"
"claude-3-5-sonnet" = "glm-5.3-flash"
"claude-3-5-sonnet-20241022" = "glm-5.3-flash"
"claude-3-5-sonnet-20240620" = "glm-5.3-flash"
"claude-sonnet" = "glm-5.3-flash"
# L3: Haiku → glm-5.3-flash (implement/debug)
"claude-haiku-4-5" = "glm-5.3-flash"
"claude-haiku-4-1" = "glm-5.3-flash"
"claude-haiku-4-0" = "glm-5.3-flash"
"claude-haiku-4" = "glm-5.3-flash"
"claude-3-5-haiku" = "glm-5.3-flash"
"claude-3-5-haiku-20241022" = "glm-5.3-flash"
"claude-3-haiku" = "glm-5.3-flash"
"claude-3-haiku-20240307" = "glm-5.3-flash"
"claude-haiku" = "glm-5.3-flash"
# 混合/简写别名（Claude Code opusplan = plan:opus + exec:sonnet）
"claude-opusplan" = "glm-5.3-flash"
"opusplan" = "glm-5.3-flash"
# L4: Fable → kimi-k3 (moonshot)
"fable-5" = "kimi-k3"

# ── Provider 配置 ──

[providers.deepseek]
reasoning_field = "reasoning_content"
thinking_param = "thinking"
thinking_type_enabled = "enabled"
thinking_type_disabled = "disabled"
disable_thinking = false
effort_param = "reasoning_effort"

[providers.deepseek.effort_map]
low = "high"
medium = "high"
high = "high"
max = "max"
xhigh = "max"

# 月之暗面官方（Kimi For Coding，api.kimi.com/coding）——OpenAI 格式，
# reasoning 以 reasoning_content 返回；端点与密钥经 MOONSHOT_OFFICIAL_URL/API_KEY 注入。
[providers.moonshot-official]
reasoning_field = "reasoning_content"
reasoning_field_alt = ["reasoning"]
disable_thinking = true
effort_param = "reasoning_effort"

[providers.moonshot-official.effort_map]
low = "low"
medium = "low"
high = "high"
max = "max"
xhigh = "max"

# Phase 3 opt-in (P3-B fail-fast + telemetry + upstream binding)
# Declaring effort_enum means every effort_map output must be in {low,high,max} - satisfied.
[providers.moonshot-official.cache_policy]
usage = "top_level_cached_tokens"
upstream = "official"
effort_enum = ["low", "high", "max"]
pinned_effort = "high"
prompt_cache_key_enabled = false
replay = "full_assistant"
history = "append_only"
relocate = "split_tail"

[providers.glm-flash]
reasoning_field = "reasoning_content"
thinking_param = "thinking"
thinking_type_enabled = "enabled"
thinking_type_disabled = "disabled"
disable_thinking = true
effort_param = "reasoning_effort"

[providers.glm-flash.effort_map]
low = "low"
medium = "high"
high = "high"
max = "max"
xhigh = "max"

[providers.glm]
reasoning_field = "reasoning_content"
thinking_param = "thinking"
thinking_type_enabled = "enabled"
thinking_type_disabled = "disabled"
disable_thinking = false
effort_param = "reasoning_effort"

[providers.glm.effort_map]
none = "none"
minimal = "minimal"
low = "low"
medium = "medium"
high = "high"
xhigh = "max"
max = "max"


[providers.gpt]
reasoning_field = ""
reasoning_field_alt = []
# thinking_param 不设 → effort=other 时不发 thinking 字段
thinking_type_enabled = "enabled"
thinking_type_disabled = "disabled"
disable_thinking = false
effort_param = "reasoning_effort"

[providers.gpt.effort_map]
low = "low"
medium = "medium"
high = "high"
max = "max"
xhigh = "xhigh"

